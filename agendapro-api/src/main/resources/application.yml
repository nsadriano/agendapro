server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: agendapro-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/agendapro}
    username: ${DB_USER:agendapro}
    password: ${DB_PASSWORD:agendapro_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
